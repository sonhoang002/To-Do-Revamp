    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ToDo Revamp</title>
    </head>
    <body>
        <div class="outer-most-container">
            <div class="action-container">
                <div class="project-header">
                    <div class="header-name">Project List</div>
                    <button class="add-project-btn"></button>
                </div>
                <div class="project-container"></div>
            </div>

            <div class="project-todo-container"></div>
        </div>

        <div class="form-container inactive">
            <form action="" class="project-form">
                <div class="project-name">Project Name:</div>
                <input class="text-input" type="text" autofocus>

                <button class="submit-btn" type="submit">Add</button>
            </form>
        </div>

        <div class="todo-form-container inactive">
            <form action="" class="todo-form">
                <div class="todo-name">Todo Name: </div>
                <input class="text-input-todo" type="text" autofocus>

                <div class="todo-description">Description: </div>
                <input class="text-description-todo" type="text">

                <div class="todo-duedate">Due Date: </div>
                <input class="todo-date" type="date">

                <select id="todo-priority">
                    <option value="">-- Priority --</option>
                    <option value="1">Low</option>
                    <option value="2">Medium</option>
                    <option value="3">High</option>
                </select>

                <button class="submit-btn-todo" type="submit">Create</button>
            </form>
        </div>

        <div class="todo-UI inactive">
            <div class="todo-details-container">
                <div class="show-todo-name">Name: </div>
                <div class="todo-div-name"></div>
                <div class="show-todo-description">Description: </div>
                <div class="todo-div-description"></div>
                <div class="show-todo-dueDate">Due Date: </div>
                <div class="todo-div-dueDate"></div>
                <div class="show-todo-priority">Priority: </div>
                <div class="todo-div-priority"></div>
            </div>
        </div>
    </body>
    </html>
